[tools]
rust = { version = "1.98", components = ["rustfmt", "clippy"] }

[tasks.dev]
description = "Open the sample markdown file in the reader"
run = "cargo run -- {{arg(name='file', i=true)}}"

[tasks.open]
description = "Open a specific markdown file in the reader"
run = "cargo run -- {{arg(name='file')}}"

[tasks.build]
description = "Release-build mdread"
run = "cargo build --release"

[tasks.install]
description = "Release-build and install mdread to ~/.local/bin"
run = """
cargo build --release
mkdir -p "$HOME/.local/bin"
install -Dm755 target/release/mdread "$HOME/.local/bin/mdread"
echo "installed $HOME/.local/bin/mdread"
"$HOME/.local/bin/mdread" --help | head -n 4
"""

[tasks.setup-omarchy]
description = "Install Omarchy theme/font hooks and the app menu entry"
run = "contrib/omarchy/setup"
