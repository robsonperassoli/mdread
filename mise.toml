[tools]
rust = { version = "1.88", components = ["rustfmt", "clippy"] }
"cargo:tauri-cli" = "2"

[tasks.dev]
description = "Open the sample markdown file in the reader"
run = "cargo tauri dev"

[tasks.open]
description = "Open a specific markdown file in the reader"
run = "cargo tauri dev -- -- {{arg(name='file')}}"

[tasks.build]
description = "Release-build mdread and package the deb for publishing"
run = "cargo tauri build"

[tasks.install]
description = "Release-build and install mdread to ~/.local/bin"
run = """
cargo tauri build --no-bundle
mkdir -p "$HOME/.local/bin"
install -Dm755 src-tauri/target/release/mdread "$HOME/.local/bin/mdread"
echo "installed $HOME/.local/bin/mdread"
"$HOME/.local/bin/mdread" --help | head -n 4
"""
