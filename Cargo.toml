[package]
name = "mdread"
version = "0.1.0"
description = "Read markdown in a clean desktop window"
authors = ["Robson Perassoli <robsonperassoli@gmail.com>"]
license = "MIT"
repository = "https://github.com/robsonperassoli/mdread"
edition = "2021"
rust-version = "1.98"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
gpui-kit = { version = "0.6", features = [
    "tree-sitter-bash",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
notify = "7"
regex = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
smol = "2"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
