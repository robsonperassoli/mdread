<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mdread</title>
    <link rel="stylesheet" href="vendor/github-markdown-light.css" id="gh-light" disabled />
    <link rel="stylesheet" href="vendor/github-markdown-dark.css" id="gh-dark" />
    <link rel="stylesheet" href="reader.css" />
  </head>
  <body>
    <div class="chrome">
      <button id="gear" type="button" aria-label="Reading settings" title="Reading settings">
        Aa
      </button>
      <span id="live" hidden>Updated</span>
    </div>
    <aside id="panel" hidden>
      <h2>Reading</h2>
      <label>
        Font
        <select id="font">
          <option value='Georgia, "Iowan Old Style", Palatino, serif'>Serif</option>
          <option value='system-ui, "Segoe UI", sans-serif'>Sans</option>
          <option value='ui-monospace, "JetBrains Mono", "Iosevka", monospace'>Mono</option>
          <option value="custom">Custom…</option>
        </select>
      </label>
      <label id="custom-font-wrap" hidden>
        Custom family
        <input id="custom-font" type="text" placeholder="Literata, serif" />
      </label>
      <label>
        Size
        <input id="size" type="range" min="14" max="28" step="1" />
      </label>
      <label>
        Title bar
        <select id="decorations">
          <option value="auto">Auto (hide on tiling WMs)</option>
          <option value="always">Always show</option>
          <option value="never">Always hide</option>
        </select>
      </label>
      <p class="row">
        <button type="button" data-theme="light">Light</button>
        <button type="button" data-theme="dark">Dark</button>
        <button type="button" data-theme="sepia">Sepia</button>
        <button type="button" data-theme="custom">Custom</button>
      </p>
      <div id="custom-colors" hidden>
        <label>Background <input id="bg" type="color" /></label>
        <label>Text <input id="fg" type="color" /></label>
      </div>
    </aside>
    <main>
      <article id="content" class="markdown-body">Loading…</article>
    </main>
    <script src="app.js"></script>
  </body>
</html>
