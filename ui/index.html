<!doctype html>
<html lang="en" data-theme="dark" data-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mdread</title>
    <link rel="stylesheet" href="vendor/github-markdown-light.css" id="gh-light" disabled />
    <link rel="stylesheet" href="vendor/github-markdown-dark.css" id="gh-dark" />
    <link rel="stylesheet" href="reader.css" />
  </head>
  <body>
    <div class="chrome">
      <button id="gear" type="button" aria-label="Reading settings" title="Reading settings">
        Aa
      </button>
      <span id="live" hidden>Updated</span>
    </div>
    <aside id="panel" hidden>
      <h2>Reading</h2>
      <div class="field">
        <span id="font-label">Font</span>
        <div class="picker" id="font-picker">
          <button
            id="font-button"
            type="button"
            aria-labelledby="font-label"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="font-menu"
          >
            <span id="font-current">Font</span>
          </button>
          <div id="font-menu" hidden>
            <input
              id="font-filter"
              type="text"
              placeholder="Filter fonts"
              autocomplete="off"
              spellcheck="false"
              aria-label="Filter fonts"
            />
            <ul id="font-list" role="listbox" aria-labelledby="font-label"></ul>
          </div>
        </div>
      </div>
      <label>
        Size
        <input id="size" type="range" min="14" max="28" step="1" />
      </label>
      <p class="row">
        <button type="button" data-theme="light">Light</button>
        <button type="button" data-theme="dark">Dark</button>
      </p>
    </aside>
    <main>
      <article id="content" class="markdown-body">Loading…</article>
    </main>
    <script src="app.js"></script>
  </body>
</html>
