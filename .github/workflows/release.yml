name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libx11-dev \
            libwayland-dev

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          stage="mdread-x86_64-linux"
          mkdir -p "$stage/contrib"
          cp target/release/mdread "$stage/mdread"
          cp -a contrib/omarchy "$stage/contrib/omarchy"
          tar -czf mdread-x86_64-linux.tar.gz "$stage"
          sha256sum mdread-x86_64-linux.tar.gz > mdread-x86_64-linux.tar.gz.sha256

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mdread-x86_64-linux.tar.gz
            mdread-x86_64-linux.tar.gz.sha256
